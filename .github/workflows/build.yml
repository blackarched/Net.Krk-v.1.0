name: Build and Release

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build Python wheel
      run: |
        python -m build
    
    - name: Upload Python artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-distributions
        path: dist/

  build-docker:
    runs-on: ubuntu-latest
    needs: build-python
    strategy:
      matrix:
        target: [full, demo]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.target }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        target: ${{ matrix.target }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).created }}
          VCS_REF=${{ github.sha }}

  test-images:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
    - name: Test full image
      run: |
        docker run --rm ghcr.io/${{ github.repository }}-full:latest python3 -c "import src.orchestrator; print('Full image OK')"
    
    - name: Test demo image
      run: |
        docker run --rm ghcr.io/${{ github.repository }}-demo:latest python3 -c "import src.dashboard_api; print('Demo image OK')"

  security-scan:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository }}-full:latest'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  release:
    runs-on: ubuntu-latest
    needs: [build-python, build-docker, test-images]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v3
    
    - name: Download Python artifacts
      uses: actions/download-artifact@v3
      with:
        name: python-distributions
        path: dist/
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this Release
          
          ### Docker Images
          - **Full Image**: `ghcr.io/${{ github.repository }}-full:${{ github.ref_name }}`
          - **Demo Image**: `ghcr.io/${{ github.repository }}-demo:${{ github.ref_name }}`
          
          ### Usage
          ```bash
          # Full functionality
          docker run --rm --cap-add=NET_ADMIN --cap-add=NET_RAW --network host ghcr.io/${{ github.repository }}-full:${{ github.ref_name }}
          
          # Demo mode
          docker run --rm -p 5000:5000 ghcr.io/${{ github.repository }}-demo:${{ github.ref_name }}
          ```
          
          ### Python Package
          Install via pip: `pip install netkrak==${{ github.ref_name }}`
        draft: false
        prerelease: false
    
    - name: Upload Python Wheel
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/netkrak-${{ github.ref_name }}-py3-none-any.whl
        asset_name: netkrak-${{ github.ref_name }}-py3-none-any.whl
        asset_content_type: application/zip
    
    - name: Upload Source Distribution
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/netkrak-${{ github.ref_name }}.tar.gz
        asset_name: netkrak-${{ github.ref_name }}.tar.gz
        asset_content_type: application/gzip