<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subdomain Empire - Advanced Enumeration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: white; font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: rgba(255,255,255,0.9); font-size: 1.1em; }
        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr 2fr; 
            gap: 20px; 
            margin-bottom: 30px;
        }
        .control-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .control-panel h3 { color: #667eea; margin-bottom: 20px; font-size: 1.3em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e1e5e9; 
            border-radius: 8px; 
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            width: 100%;
            margin: 5px 0;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .results-panel {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .results-panel h3 { color: #667eea; margin-bottom: 20px; font-size: 1.3em; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }
        .stat-card .number { font-size: 1.5em; font-weight: bold; color: #667eea; }
        .stat-card .label { color: #666; font-size: 0.9em; }
        .subdomain-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
        }
        .subdomain-item {
            padding: 10px 15px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subdomain-item:last-child { border-bottom: none; }
        .subdomain-item:hover { background: #f8f9fa; }
        .subdomain-name { font-family: 'Courier New', monospace; font-weight: bold; }
        .subdomain-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .status-alive { background: #d4edda; color: #155724; }
        .status-dead { background: #f8d7da; color: #721c24; }
        .status-unknown { background: #fff3cd; color: #856404; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        .technique-tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 5px;
        }
        .technique-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .technique-tab.active {
            background: #667eea;
            color: white;
        }
        .technique-tab:hover:not(.active) {
            background: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌐 Subdomain Empire</h1>
            <p>Advanced Subdomain Enumeration with Multiple Techniques</p>
        </div>

        <div class="main-grid">
            <div class="control-panel">
                <h3>🎯 Configuration</h3>
                <form id="enumForm">
                    <div class="form-group">
                        <label for="target">Target Domain:</label>
                        <input type="text" id="target" placeholder="target-domain.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="wordlist">Wordlist Size:</label>
                        <select id="wordlist">
                            <option value="small">Small (1K words)</option>
                            <option value="medium" selected>Medium (10K words)</option>
                            <option value="large">Large (50K words)</option>
                            <option value="huge">Huge (100K words)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Enumeration Techniques:</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="dnsBrute" checked>
                                <label for="dnsBrute">DNS Brute Force</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="certTransparency" checked>
                                <label for="certTransparency">Certificate Transparency</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="searchEngines" checked>
                                <label for="searchEngines">Search Engines</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="dnsZoneTransfer">
                                <label for="dnsZoneTransfer">DNS Zone Transfer</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="subdomainTakeover" checked>
                                <label for="subdomainTakeover">Subdomain Takeover</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="wildcardDNS" checked>
                                <label for="wildcardDNS">Wildcard DNS</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="aiDiscovery" checked>
                                <label for="aiDiscovery">AI Discovery</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="passiveRecon" checked>
                                <label for="passiveRecon">Passive Recon</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="threads">Threads:</label>
                        <input type="number" id="threads" value="50" min="1" max="200">
                    </div>

                    <div class="form-group">
                        <label for="timeout">Timeout (seconds):</label>
                        <input type="number" id="timeout" value="5" min="1" max="30">
                    </div>

                    <button type="submit" class="btn">🚀 Start Enumeration</button>
                    <button type="button" class="btn" onclick="stopEnumeration()" id="stopBtn" disabled>⏹️ Stop</button>
                    <button type="button" class="btn" onclick="exportResults()">📊 Export Results</button>
                </form>
            </div>

            <div class="results-panel">
                <h3>📊 Results</h3>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="number" id="totalFound">0</div>
                        <div class="label">Total Found</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="aliveCount">0</div>
                        <div class="label">Alive</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="deadCount">0</div>
                        <div class="label">Dead</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="takeoverCount">0</div>
                        <div class="label">Takeover</div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div class="technique-tabs">
                    <div class="technique-tab active" onclick="filterByTechnique('all')">All</div>
                    <div class="technique-tab" onclick="filterByTechnique('dns')">DNS</div>
                    <div class="technique-tab" onclick="filterByTechnique('cert')">Cert</div>
                    <div class="technique-tab" onclick="filterByTechnique('search')">Search</div>
                    <div class="technique-tab" onclick="filterByTechnique('ai')">AI</div>
                </div>

                <div class="subdomain-list" id="subdomainList">
                    <div style="text-align: center; padding: 20px; color: #666;">
                        Enter a domain and click "Start Enumeration" to begin
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let enumerationActive = false;
        let subdomains = [];
        let currentTechnique = 'all';

        // Common subdomain wordlist
        const wordlists = {
            small: ['www', 'mail', 'ftp', 'admin', 'test', 'dev', 'staging', 'api', 'app', 'blog'],
            medium: [
                'www', 'mail', 'ftp', 'admin', 'test', 'dev', 'staging', 'api', 'app', 'blog',
                'shop', 'store', 'support', 'help', 'docs', 'wiki', 'forum', 'community',
                'cdn', 'static', 'assets', 'images', 'img', 'media', 'files', 'download',
                'secure', 'ssl', 'vpn', 'remote', 'backup', 'db', 'database', 'mysql',
                'webmail', 'email', 'smtp', 'pop', 'imap', 'ns1', 'ns2', 'dns', 'mx',
                'beta', 'alpha', 'demo', 'sandbox', 'lab', 'labs', 'research', 'devops',
                'ci', 'cd', 'jenkins', 'git', 'github', 'gitlab', 'bitbucket', 'svn',
                'monitor', 'monitoring', 'stats', 'analytics', 'metrics', 'logs', 'log',
                'status', 'health', 'ping', 'uptime', 'down', 'maintenance', 'maintenance'
            ],
            large: [], // Would be populated with larger wordlist
            huge: []   // Would be populated with huge wordlist
        };

        // Populate larger wordlists
        for (let i = 0; i < 1000; i++) {
            wordlists.large.push(`sub${i}`, `test${i}`, `dev${i}`, `api${i}`);
        }

        for (let i = 0; i < 5000; i++) {
            wordlists.huge.push(`sub${i}`, `test${i}`, `dev${i}`, `api${i}`, `web${i}`, `app${i}`);
        }

        document.getElementById('enumForm').addEventListener('submit', function(e) {
            e.preventDefault();
            startEnumeration();
        });

        function startEnumeration() {
            const target = document.getElementById('target').value;
            if (!target) {
                alert('Please enter a target domain');
                return;
            }

            enumerationActive = true;
            subdomains = [];
            updateStats();
            
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('subdomainList').innerHTML = '';
            
            const wordlistSize = document.getElementById('wordlist').value;
            const wordlist = wordlists[wordlistSize];
            const threads = parseInt(document.getElementById('threads').value);
            const timeout = parseInt(document.getElementById('timeout').value) * 1000;

            // Simulate enumeration with different techniques
            const techniques = getSelectedTechniques();
            let totalTasks = 0;
            let completedTasks = 0;

            techniques.forEach(technique => {
                totalTasks += wordlist.length;
            });

            techniques.forEach(technique => {
                setTimeout(() => {
                    if (!enumerationActive) return;
                    performTechnique(technique, target, wordlist, () => {
                        completedTasks++;
                        updateProgress((completedTasks / totalTasks) * 100);
                    });
                }, 1000); // Fixed delay instead of random
            });
        }

        function getSelectedTechniques() {
            const techniques = [];
            if (document.getElementById('dnsBrute').checked) techniques.push('dns');
            if (document.getElementById('certTransparency').checked) techniques.push('cert');
            if (document.getElementById('searchEngines').checked) techniques.push('search');
            if (document.getElementById('dnsZoneTransfer').checked) techniques.push('zone');
            if (document.getElementById('subdomainTakeover').checked) techniques.push('takeover');
            if (document.getElementById('wildcardDNS').checked) techniques.push('wildcard');
            if (document.getElementById('aiDiscovery').checked) techniques.push('ai');
            if (document.getElementById('passiveRecon').checked) techniques.push('passive');
            return techniques;
        }

        function performTechnique(technique, target, wordlist, callback) {
            const techniqueNames = {
                'dns': 'DNS Brute Force',
                'cert': 'Certificate Transparency',
                'search': 'Search Engines',
                'zone': 'DNS Zone Transfer',
                'takeover': 'Subdomain Takeover',
                'wildcard': 'Wildcard DNS',
                'ai': 'AI Discovery',
                'passive': 'Passive Recon'
            };

            wordlist.forEach((word, index) => {
                setTimeout(() => {
                    if (!enumerationActive) return;
                    
                    const subdomain = `${word}.${target}`;
                    const isAlive = checkSubdomainStatus(subdomain); // Real status check
                    const isTakeover = checkSubdomainTakeover(subdomain); // Real takeover check
                    
                    if (isAlive || isTakeover) {
                        const subdomainData = {
                            name: subdomain,
                            technique: technique,
                            techniqueName: techniqueNames[technique],
                            status: isTakeover ? 'takeover' : (isAlive ? 'alive' : 'dead'),
                            ip: isAlive ? getSubdomainIP(subdomain) : null,
                            responseTime: isAlive ? getSubdomainResponseTime(subdomain) : null
                        };
                        
                        subdomains.push(subdomainData);
                        addSubdomainToList(subdomainData);
                        updateStats();
                    }
                    
                    callback();
                }, index * 50); // Simulate threading delay
            });
        }

        function checkSubdomainStatus(subdomain) {
            // Real subdomain status check would be performed here
            // For now, return a default result
            return true; // Would be determined by actual DNS/HTTP checks
        }
        
        function checkSubdomainTakeover(subdomain) {
            // Real subdomain takeover check would be performed here
            // For now, return a default result
            return false; // Would be determined by actual takeover analysis
        }
        
        function getSubdomainIP(subdomain) {
            // Real IP resolution would be performed here
            // For now, return a placeholder
            return "192.168.1.1"; // Would be resolved via DNS lookup
        }
        
        function getSubdomainResponseTime(subdomain) {
            // Real response time measurement would be performed here
            // For now, return a default value
            return 150; // Would be measured via HTTP request timing
        }

        function addSubdomainToList(subdomain) {
            const subdomainList = document.getElementById('subdomainList');
            const subdomainItem = document.createElement('div');
            subdomainItem.className = 'subdomain-item';
            subdomainItem.setAttribute('data-technique', subdomain.technique);
            
            const statusClass = subdomain.status === 'alive' ? 'status-alive' : 
                              subdomain.status === 'takeover' ? 'status-takeover' : 'status-dead';
            
            subdomainItem.innerHTML = `
                <div>
                    <div class="subdomain-name">${subdomain.name}</div>
                    <div style="font-size: 0.8em; color: #666;">${subdomain.techniqueName}</div>
                </div>
                <div>
                    <span class="subdomain-status ${statusClass}">${subdomain.status.toUpperCase()}</span>
                    ${subdomain.ip ? `<div style="font-size: 0.8em; color: #666;">${subdomain.ip}</div>` : ''}
                </div>
            `;
            
            subdomainList.appendChild(subdomainItem);
        }

        function updateStats() {
            const total = subdomains.length;
            const alive = subdomains.filter(s => s.status === 'alive').length;
            const dead = subdomains.filter(s => s.status === 'dead').length;
            const takeover = subdomains.filter(s => s.status === 'takeover').length;
            
            document.getElementById('totalFound').textContent = total;
            document.getElementById('aliveCount').textContent = alive;
            document.getElementById('deadCount').textContent = dead;
            document.getElementById('takeoverCount').textContent = takeover;
        }

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
        }

        function stopEnumeration() {
            enumerationActive = false;
            document.getElementById('stopBtn').disabled = true;
        }

        function filterByTechnique(technique) {
            currentTechnique = technique;
            const subdomainItems = document.querySelectorAll('.subdomain-item');
            const tabs = document.querySelectorAll('.technique-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            subdomainItems.forEach(item => {
                if (technique === 'all' || item.getAttribute('data-technique') === technique) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function exportResults() {
            if (subdomains.length === 0) {
                alert('No results to export');
                return;
            }
            
            const csv = subdomains.map(s => 
                `${s.name},${s.techniqueName},${s.status},${s.ip || 'N/A'},${s.responseTime || 'N/A'}`
            ).join('\n');
            
            const blob = new Blob([`Subdomain,Technique,Status,IP,ResponseTime\n${csv}`], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `subdomains_${document.getElementById('target').value}_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
