<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSS Payload Generator - Advanced Context-Aware</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            min-height: 100vh;
            color: #333;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: white; font-size: 2.5em; margin-bottom: 10px; }
        .header p { color: rgba(255,255,255,0.9); font-size: 1.1em; }
        .generator-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 20px; 
            margin-bottom: 30px;
        }
        .generator-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .generator-card h3 { color: #ff6b6b; margin-bottom: 15px; font-size: 1.3em; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e1e5e9; 
            border-radius: 8px; 
            font-size: 1em;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        .btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .payloads-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .payload-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            position: relative;
        }
        .payload-item .context { 
            color: #ff6b6b; 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-family: 'Segoe UI', sans-serif;
        }
        .payload-item .payload { 
            color: #333; 
            background: #fff;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #ff6b6b;
        }
        .copy-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
        }
        .copy-btn:hover { background: #ee5a24; }
        .filter-tabs {
            display: flex;
            margin-bottom: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 5px;
        }
        .filter-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        .filter-tab.active {
            background: #ff6b6b;
            color: white;
        }
        .filter-tab:hover:not(.active) {
            background: #e9ecef;
        }

                            <option value="basic">Basic Filter</option>

                            <option value="cloudflare">Cloudflare</option>

                            <option value="unicode">Unicode Encoding</option>
                            <option value="base64">Base64 Encoding</option>
                            <option value="mixed">Mixed Encoding</option>

        function generatePayloads() {
            const context = document.getElementById('context').value;
            const waf = document.getElementById('waf').value;
            const encoding = document.getElementById('encoding').value;
            const customPayload = document.getElementById('customPayload').value;
            
            let payloads = [];
            
            if (customPayload) {
                payloads.push({ context: 'custom', payload: customPayload });
            }
            
            if (context === 'all') {
                Object.keys(payloadDatabase).forEach(ctx => {
                    payloadDatabase[ctx].forEach(payload => {
                        payloads.push({ context: ctx, payload: applyEncoding(payload, encoding) });
                    });
                });
            } else {
                payloadDatabase[context].forEach(payload => {
                    payloads.push({ context: context, payload: applyEncoding(payload, encoding) });
                });
            }
            
            if (waf !== 'none' && wafBypasses[waf]) {
                wafBypasses[waf].forEach(payload => {
                    payloads.push({ context: 'waf-bypass', payload: applyEncoding(payload, encoding) });
                });
            }
            
            displayPayloads(payloads);
        }

        function applyEncoding(payload, encoding) {
            switch (encoding) {
                case 'url':
                    return encodeURIComponent(payload);
                case 'html':
                    return payload.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;');
                case 'unicode':
                    return payload.split('').map(c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')).join('');
                case 'base64':
                    return btoa(payload);
                case 'mixed':
                    return btoa(encodeURIComponent(payload));
                default:
                    return payload;
            }
        }

        function displayPayloads(payloads) {
            const payloadsList = document.getElementById('payloadsList');
            payloadsList.innerHTML = '';
            
            payloads.forEach((item, index) => {
                const payloadItem = document.createElement('div');
                payloadItem.className = 'payload-item';
                payloadItem.setAttribute('data-context', item.context);
                payloadItem.innerHTML = `
                    <div class="context">${item.context.toUpperCase()}</div>
                    <div class="payload">${item.payload}</div>
                    <button class="copy-btn" onclick="copyToClipboard('${item.payload.replace(/'/g, "\\'")}')">Copy</button>
                `;
                payloadsList.appendChild(payloadItem);
            });
        }

        function filterPayloads(context) {
            const payloadItems = document.querySelectorAll('.payload-item');
            const tabs = document.querySelectorAll('.filter-tab');
            
            tabs.forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            
            payloadItems.forEach(item => {
                if (context === 'all' || item.getAttribute('data-context') === context) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Payload copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
